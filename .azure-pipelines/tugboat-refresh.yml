# Refreshes the Tugboat base previews and rebuilds their child previews on a
# schedule.
trigger: none
pr: none

schedules:
         # ┌───────────── minute (0 - 59)
         # │ ┌───────────── hour (0 - 23, UTC)
         # │ │ ┌───────────── day of the month (1 - 31)
         # │ │ │ ┌───────────── month (1 - 12)
         # │ │ │ │ ┌───────────── day of the week (0 - 6, Sunday = 0)
         # * * * * *
  - cron: '8 0 * * *'
    displayName: Refresh base previews
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: tugboat

steps:
  - checkout: self
    fetchDepth: 1
  - bash: bash .azure-pipelines/scripts/refresh-base-previews.sh
    displayName: Refresh base previews and rebuild children
    env:
      TUGBOAT_API_TOKEN: $(TUGBOAT_API_TOKEN)
