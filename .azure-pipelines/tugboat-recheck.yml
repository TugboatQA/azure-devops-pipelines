# Re-evaluates the Visual Diffs and Lighthouse status checks after someone
# approves a failed report in the Tugboat dashboard.
#
# Runs when:
#   - Someone comments exactly "/tugboat recheck" on a pull request. A
#     "Pull request commented on" service hook sends the comment to the
#     tugboat-pr-comment Incoming WebHook service connection.
#   - Someone runs this pipeline manually, with a pull request ID or "all".
trigger: none
pr: none

parameters:
  - name: prId
    displayName: Pull request ID, or "all" for every active pull request
    type: string
    default: all

resources:
  webhooks:
    - webhook: PullRequestComment
      connection: tugboat-pr-comment
      filters:
        - path: resource.comment.content
          value: /tugboat recheck

# To also recheck on a schedule, uncomment this block. Each run uses
# pipeline minutes and the organization's parallel job, so a short interval
# can exceed the free tier and delay tugboat-pr runs.
# schedules:
#   - cron: '*/5 * * * *'
#     displayName: Recheck Tugboat reports
#     branches:
#       include:
#         - main
#     always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: tugboat

steps:
  - checkout: self
    fetchDepth: 1
  - bash: bash .azure-pipelines/scripts/recheck-reports.sh "${PR_ID}"
    displayName: Recheck Visual Diffs and Lighthouse reports
    env:
      PR_ID: ${{ coalesce(parameters.PullRequestComment.resource.pullRequest.pullRequestId, parameters.prId) }}
      TUGBOAT_API_TOKEN: $(TUGBOAT_API_TOKEN)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
