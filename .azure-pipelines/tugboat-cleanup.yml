# Deletes the previews of pull requests that are completed or abandoned. The
# tugboat-pr pipeline deletes these as soon as a pull request closes; this
# pipeline deletes any that it missed.
trigger: none
pr: none

schedules:
         # ┌───────────── minute (0 - 59)
         # │ ┌───────────── hour (0 - 23, UTC)
         # │ │ ┌───────────── day of the month (1 - 31)
         # │ │ │ ┌───────────── month (1 - 12)
         # │ │ │ │ ┌───────────── day of the week (0 - 6, Sunday = 0)
         # * * * * *
  - cron: '0 * * * *'
    displayName: Delete previews for closed pull requests
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: tugboat

steps:
  - checkout: self
    fetchDepth: 1
  - bash: bash .azure-pipelines/scripts/cleanup-closed-prs.sh
    displayName: Delete previews for closed pull requests
    env:
      TUGBOAT_API_TOKEN: $(TUGBOAT_API_TOKEN)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
